<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프라이빗 룸 틱택토</title>
  <style>
    body { font-family: 'Pretendard', sans-serif; text-align: center; margin-top: 50px; background-color: #f8f9fa; }
    h1 { color: #2c3e50; }
    #lobby { margin-top: 40px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: inline-block; }
    .input-box { padding: 12px; font-size: 16px; width: 150px; text-align: center; font-weight: bold; text-transform: uppercase; border: 2px solid #ddd; border-radius: 6px; }
    #roomCodeDisplay { background: #ffeaa7; display: inline-block; padding: 5px 15px; border-radius: 20px; color: #d35400; font-size: 18px; margin-bottom: 20px; }
    #status { font-size: 22px; font-weight: bold; margin-bottom: 15px; color: #333; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; margin-bottom: 20px; }
    .cell { width: 100px; height: 100px; background-color: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
    .cell:hover { background-color: #ddd; }
    .X { color: #ff4757; }
    .O { color: #1e90ff; }
    button { padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #2f3542; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; margin: 5px; }
    button:hover { background-color: #57606f; }
    .btn-create { background-color: #ff6b81; }
    .btn-create:hover { background-color: #ff4757; }
    .btn-join { background-color: #1e90ff; }
    .btn-join:hover { background-color: #3742fa; }
  </style>
</head>
<body>

  <h1>🔥 프라이빗 틱택토</h1>
  
  <div id="lobby">
    <button id="createRoomBtn" class="btn-create">새로운 방 만들기</button>
    <div style="margin: 20px 0; color: #888; font-weight: bold;">또는</div>
    <input type="text" id="joinCodeInput" class="input-box" placeholder="코드 4자리" maxlength="4">
    <button id="joinRoomBtn" class="btn-join">코드로 입장하기</button>
  </div>

  <div id="gameArea" style="display: none;">
    <h2 id="roomCodeDisplay">방 코드: </h2>
    <div id="roleSelection" style="margin-bottom: 15px;">
      <p style="font-weight: bold; color: #555;">어떤 돌을 선택하시겠습니까?</p>
      <button id="btnX" class="X">나는 'X' 플레이어</button>
      <button id="btnO" class="O">나는 'O' 플레이어</button>
    </div>
    <div id="myRoleText" style="color: #27ae60; font-weight: bold; margin-bottom: 15px; font-size: 18px;"></div>
    <div id="status">상대방을 기다리는 중...</div>
    <div class="board" id="board"></div>
    <button id="resetBtn" style="margin-top: 20px;">보드 리셋</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
      
    const firebaseConfig = {
      apiKey: "AIzaSyBdX2nqZYkH_V33s_bV8TRpa-rAIiBWbcQ",
      authDomain: "test-eb398.firebaseapp.com",
      databaseURL: "https://test-eb398-default-rtdb.firebaseio.com",
      projectId: "test-eb398",
      storageBucket: "test-eb398.firebasestorage.app",
      messagingSenderId: "891253595501",
      appId: "1:891253595501:web:3ddde2a9c70708c9100e64",
      measurementId: "G-YHBCECWKPL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    let currentRoomCode = null;
    let gameRef = null;
    let currentGameState = null;
    let myRole = null; 

    const lobbyDiv = document.getElementById('lobby');
    const gameAreaDiv = document.getElementById('gameArea');
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    const roleSelectionDiv = document.getElementById('roleSelection');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');

    const winLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], 
      [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]
    ];

    document.getElementById('createRoomBtn').addEventListener('click', () => {
      currentRoomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      gameRef = ref(db, 'rooms/' + currentRoomCode);
      
      set(gameRef, {
        board: ['', '', '', '', '', '', '', '', ''],
        turn: 'X',
        winner: null
      }).then(() => {
        enterGameRoom(currentRoomCode);
      }).catch((error) => {
        alert("데이터베이스 권한 오류입니다! 파이어베이스에서 Rules(규칙)를 true로 바꿨는지 확인해주세요.");
      });
    });

    document.getElementById('joinRoomBtn').addEventListener('click', async () => {
      const code = document.getElementById('joinCodeInput').value.toUpperCase();
      if (code.length !== 4) return alert('4자리 코드를 입력해주세요!');
      
      try {
        const tempRef = ref(db, 'rooms/' + code);
        const snapshot = await get(tempRef);
        
        if (snapshot.exists()) {
          currentRoomCode = code;
          gameRef = tempRef;
          enterGameRoom(currentRoomCode);
        } else {
          alert('존재하지 않는 방입니다. 방 코드를 다시 확인해주세요.');
        }
      } catch(error) {
         alert("데이터베이스 권한 오류입니다! 파이어베이스에서 Rules(규칙)를 true로 바꿨는지 확인해주세요.");
      }
    });

    function enterGameRoom(code) {
      lobbyDiv.style.display = 'none';
      gameAreaDiv.style.display = 'block';
      roomCodeDisplay.textContent = `방 코드: [ ${code} ] - 친구에게 알려주세요!`;
      
      boardElement.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        
        cell.addEventListener('click', () => {
          if (!currentGameState) return; 
          if (currentGameState.winner) return; 
          if (currentGameState.board[i] !== '') return; 
          
          if (!myRole) return alert('위에서 먼저 X 또는 O 역할을 선택해주세요!');
          if (currentGameState.turn !== myRole) return alert('당신 턴이 아닙니다! 기다려주세요.');

          const newBoard = [...currentGameState.board];
          newBoard[i] = currentGameState.turn;

          let newWinner = null;
          for (let line of winLines) {
            const [a, b, c] = line;
            if (newBoard[a] && newBoard[a] === newBoard[b] && newBoard[a] === newBoard[c]) {
              newWinner = newBoard[a];
            }
          }
          if (!newWinner && !newBoard.includes('')) newWinner = 'draw';

          set(gameRef, { board: newBoard, turn: currentGameState.turn === 'X' ? 'O' : 'X', winner: newWinner || null });
        });
        boardElement.appendChild(cell);
      }

      onValue(gameRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        currentGameState = data;
        
        const cells = document.querySelectorAll('.cell');
        cells.forEach((cell, index) => {
          const val = data.board[index];
          cell.textContent = val;
          cell.className = `cell ${val}`; 
        });

        if (data.winner === 'draw') {
          statusElement.textContent = "무승부입니다! 🤝";
        } else if (data.winner) {
          statusElement.textContent = `🎉 ${data.winner} 플레이어 승리!`;
        } else {
          statusElement.textContent = `현재 턴: ${data.turn}`;
        }
      });
    }

    document.getElementById('btnX').addEventListener('click', () => {
      myRole = 'X';
      document.getElementById('myRoleText').textContent = "나의 역할 : X";
      roleSelectionDiv.style.display = 'none';
    });

    document.getElementById('btnO').addEventListener('click', () => {
      myRole = 'O';
      document.getElementById('myRoleText').textContent = "나의 역할 : O";
      roleSelectionDiv.style.display = 'none';
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if(!gameRef) return;
      set(gameRef, { board: ['', '', '', '', '', '', '', '', ''], turn: 'X', winner: null });
    });
  </script>
</body>
</html>
